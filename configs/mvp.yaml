# MVP 설정

# 프로젝트 설정
project:
  name: why-this-product
  phase: phase1

# 데이터 설정
data:
  dataset: amazon_reviews_2018_all_beauty   # 데이터셋 이름
  raw_dir: data/raw                         # 원본 데이터 경로 (데이터 원본)
  processed_dir: data/processed             # 처리된 데이터 경로 (데이터 처리)
  train_ratio: 0.8                          # 학습 데이터 비율
  valid_ratio: 0.1                          # 검증 데이터 비율
  test_ratio: 0.1                           # 테스트 데이터 비율

# 추천 설정
retrieval:
  popularity_top_n: 200                     # 인기도 기준 추천 상품 개수
  content_faiss_top_k: 100                  # 콘텐츠 기반 추천 상품 개수
  hybrid_merge_k: 150                       # 인기도와 콘텐츠 기반 추천 결과를 혼합하여 추천 상품 개수

# iALS (implicit CF retrieve)
ials:
  factors: 64
  regularization: 0.01
  iterations: 15
  alpha: 40
  top_k: 100
  artifact_dir: data/processed/ials
  variant: rating_ge_5   # all | rating_ge_3 | rating_ge_4 | rating_ge_5 (eval 승자)

# 랭킹 설정
ranking:
  strategy: score_blend
  model: null
  top_k: 50

# 리랭킹 설정
rerank:
  strategy: mmr
  lambda_diversity: 0.7
  final_k: 10

# RAG 설정
rag:
  enabled: true
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  faiss_index_dir: data/processed/faiss_index
  llm_required: true
  llm_model: gpt-4o-mini

# 서비스 설정
serving:
  api_host: 0.0.0.0
  api_port: 8000
  recommend_path: /api/recommend
  explain_path: /api/explain
